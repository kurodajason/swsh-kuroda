name: Build SwShRecomp (no AVX2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Keep Unix line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the project's tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\setup_windows.ps1

      - name: Build the release
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:/c/msys64/usr/bin:$PATH"
          pacman -S --noconfirm zip
          for i in 1 2 3; do make deps-windows && break; echo "deps failed, retry $i"; sleep 30; done
          [ -f build/deps-win/lib/libavcodec.dll.a ] || { echo "FFmpeg deps missing"; exit 1; }
          .venv/Scripts/python.exe -m pip install pyinstaller
          make gen-helper
          tools/fetch_zig.sh
          make dist GENARCH=-march=x86-64-v2

      - name: Check the runtime libraries have no AVX or FMA
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:/c/msys64/usr/bin:$PATH"
          if ! command -v llvm-objdump >/dev/null; then
            echo "llvm-objdump not found, skipping the check"; exit 0
          fi
          bad=0
          for f in build/zig-slim/rt/*.lib build/zig-slim/rt/*.obj; do
            n=$(llvm-objdump -d --no-show-raw-insn "$f" 2>/dev/null | grep -E '^\s+[0-9a-f]+:\s+v[a-z0-9]+\s' | grep -vcE '\sv(err|erw)' || true)
            echo "$f: $n AVX instructions"
            if [ "$n" != "0" ]; then bad=1; fi
          done
          if [ "$bad" = "1" ]; then echo "FAILED: AVX instructions are still in the runtime"; exit 1; fi
          echo "OK: no AVX or FMA in the runtime libraries"

      - name: Check the AVX2 popup is gone
        shell: bash
        run: |
          if grep -q "needs a CPU with AVX2" build/win-release/SwShRecomp.exe; then
            echo "WARNING: the old AVX2 message is still inside the exe"
          else
            echo "OK: the old AVX2 message is gone"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwShRecomp-no-avx2
          path: |
            build/dist/*.zip
            build/dist/SwShRecomp
